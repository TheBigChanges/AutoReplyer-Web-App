name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: API, authentication, security and deployment probe tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check browser module syntax
        run: |
          for file in dist/*.js; do
            node --check "$file"
          done
      - run: node tests/test_i18n.mjs
      - run: node tests/test_api_client.mjs

  postgres:
    name: Pinned bot / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: ar_webapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d ar_webapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AR_TEST_DATABASE_URL: postgresql://testuser:test-password@127.0.0.1:5432/ar_webapp_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare the exact Docker-pinned source and fresh manifest
        run: python scripts/prepare_upstream.py --dest "$RUNNER_TEMP/upstream" --output "$RUNNER_TEMP/upstream-contract.json"
      - name: Real SQL, owner isolation, plan limits and concurrent state tests
        run: python tests/integration_upstream.py
      - name: Save the exact tested source identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-contract-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-contract.json
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser / Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt
      - name: Install browser test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-browser.txt
      - name: Install matching Chromium and Linux libraries
        run: python -m playwright install --with-deps chromium
      - name: Run all nine browser suites on isolated FastAPI
        run: python scripts/run_browser_checks.py
      - name: Save browser logs, summaries and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-checks-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
